<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Rethabile Shongwe | Video &amp; Content Specialist</title>
    <meta name="description" content="Rethabile Shongwe: video and content specialist with 15+ years in African digital media. AMVCA, Big Brother Naija, Nigerian Idol, Africa Magic.">
    <meta property="og:title" content="Rethabile Shongwe | Video & Content Specialist">
    <meta property="og:description" content="15+ years leading video and content across Africa.">
    <meta property="og:image" content="assets/img/reel-title.jpg">
    <meta name="theme-color" content="#f4f2ee">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="home">
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="#top">R. Shongwe</a>
        <nav class="nav">
          <a href="#work">Work</a>
          <a class="hide-sm" href="#about">About</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main id="top">
      <section class="wrap hero" id="hero"></section>

      <div class="wrap">
        <div class="player" id="reel"></div>
      </div>

      <section class="section" id="about">
        <div class="wrap">
          <div class="panel" id="panel"></div>
          <div class="stats" id="stats"></div>
        </div>
      </section>

      <section class="section" id="work">
        <div class="wrap">
          <div class="section-head">
            <h2 class="display">Selected work</h2>
            <span class="count" id="work-count"></span>
          </div>
          <div class="filters" id="filters" role="group" aria-label="Filter work by category"></div>
          <div class="pieces" id="work-grid"></div>
        </div>
      </section>

      <section class="section" id="highlights">
        <div class="wrap">
          <div class="section-head"><h2 class="display">Highlights</h2></div>
          <p class="highlights-intro" id="highlights-intro"></p>
          <ul class="highlights" id="highlights-list"></ul>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <div class="section-head"><h2 class="display">Experience</h2></div>
          <ul class="timeline" id="timeline"></ul>
          <p class="edu" id="edu"></p>
        </div>
      </section>

      <div class="wrap"><p class="label">Shows and channels I've worked on</p></div>
      <section class="clients" id="clients"></section>

      <section class="wrap contact" id="contact"></section>
    </main>

    <footer class="site-footer" id="footer"></footer>

    <script src="content.js"></script>
    <script src="main.js"></script>
  </body>
</html>
